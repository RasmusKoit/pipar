manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: RasmusKoit
      url-base: https://github.com/RasmusKoit
    - name: urob
      url-base: https://github.com/urob
    - name: filippor
      url-base: https://github.com/filippor
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: RasmusKoit
      # zmk-4.1-battery-profile: upstream main bb2d711 (2026-11-14, Zephyr 4.1)
      # plus the battery profile, split battery and backlight commits.
      revision: e2d438bf9b3a95850115ce2bd8a98c79e4cbe6f3
      import: app/west.yml
    - name: zmk-keyboard-pipar
      remote: RasmusKoit
      revision: 52ced6911ffdacc0f2ada36ac9ae9e6c03a9354d # main, same commit as the submodule
    - name: zmk-unicode
      remote: urob
      revision: 6ce21267e497e20ff9e05da16d4eefcdd3e89190 # main, 2026-10-08: "Include keys.h"
    - name: kb_zmk_ps2_mouse_trackpoint_driver
      remote: RasmusKoit
      revision: cb9012b414b4f3a9696530137786214def0272cf # pipar-stability, 2026-08-24
    # Zephyr, pinned here instead of following the v4.1.0+zmk-fixes branch that
    # ZMK's app/west.yml names. This entry overrides that one, so the import
    # block must stay in step with ZMK's app/west.yml when ZMK is updated.
    - name: zephyr
      remote: zmkfirmware
      revision: 10ba6d0cb38bc3d258775d27982f707599320085 # v4.1.0+zmk-fixes, 2026-08-14
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m
  self:
    path: config

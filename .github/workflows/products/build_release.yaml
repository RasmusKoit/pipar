# Release build matrix, used by release.yml.
#
# The parts that hold the keymap (Point right half, Sool dongle) are built
# for every combination of
#   computer layout: estonian | international (US / US International)
#   OS:              windows | mac | linux
#   keyboard layout: colemak-dh | qwerty
# The Sool's international keymap doesn't depend on the OS, so it is built
# per keyboard layout only. The other parts are built once.
#
# The flags are DTS preprocessor defines read by
# zmk-keyboard-pipar/include/pipar/keymap_variant.h. Artifact names are
# <part>-<computer>[-<os>]-<layout>; release.yml sorts them into folders
# by those words.
---
include:
  # Pipar Point: the right half holds the keymap
  - board: pipar_point@right
    snippet: trackpoint studio-rpc-usb-uart
    cmake-args: '-DDTS_EXTRA_CPPFLAGS="-DPIPAR_HOST_ESTONIAN;-DPIPAR_OS_WIN;-DPIPAR_LAYOUT_COLEMAK_DH"'
    artifact-name: pipar-point-right-estonian-windows-colemak-dh
  - board: pipar_point@right
    snippet: trackpoint studio-rpc-usb-uart
    cmake-args: '-DDTS_EXTRA_CPPFLAGS="-DPIPAR_HOST_ESTONIAN;-DPIPAR_OS_WIN;-DPIPAR_LAYOUT_QWERTY"'
    artifact-name: pipar-point-right-estonian-windows-qwerty
  - board: pipar_point@right
    snippet: trackpoint studio-rpc-usb-uart
    cmake-args: '-DDTS_EXTRA_CPPFLAGS="-DPIPAR_HOST_ESTONIAN;-DPIPAR_OS_MAC;-DPIPAR_LAYOUT_COLEMAK_DH"'
    artifact-name: pipar-point-right-estonian-mac-colemak-dh
  - board: pipar_point@right
    snippet: trackpoint studio-rpc-usb-uart
    cmake-args: '-DDTS_EXTRA_CPPFLAGS="-DPIPAR_HOST_ESTONIAN;-DPIPAR_OS_MAC;-DPIPAR_LAYOUT_QWERTY"'
    artifact-name: pipar-point-right-estonian-mac-qwerty
  - board: pipar_point@right
    snippet: trackpoint studio-rpc-usb-uart
    cmake-args: '-DDTS_EXTRA_CPPFLAGS="-DPIPAR_HOST_ESTONIAN;-DPIPAR_OS_LINUX;-DPIPAR_LAYOUT_COLEMAK_DH"'
    artifact-name: pipar-point-right-estonian-linux-colemak-dh
  - board: pipar_point@right
    snippet: trackpoint studio-rpc-usb-uart
    cmake-args: '-DDTS_EXTRA_CPPFLAGS="-DPIPAR_HOST_ESTONIAN;-DPIPAR_OS_LINUX;-DPIPAR_LAYOUT_QWERTY"'
    artifact-name: pipar-point-right-estonian-linux-qwerty
  - board: pipar_point@right
    snippet: trackpoint studio-rpc-usb-uart
    cmake-args: '-DDTS_EXTRA_CPPFLAGS="-DPIPAR_HOST_INTERNATIONAL;-DPIPAR_OS_WIN;-DPIPAR_LAYOUT_COLEMAK_DH"'
    artifact-name: pipar-point-right-international-windows-colemak-dh
  - board: pipar_point@right
    snippet: trackpoint studio-rpc-usb-uart
    cmake-args: '-DDTS_EXTRA_CPPFLAGS="-DPIPAR_HOST_INTERNATIONAL;-DPIPAR_OS_WIN;-DPIPAR_LAYOUT_QWERTY"'
    artifact-name: pipar-point-right-international-windows-qwerty
  - board: pipar_point@right
    snippet: trackpoint studio-rpc-usb-uart
    cmake-args: '-DDTS_EXTRA_CPPFLAGS="-DPIPAR_HOST_INTERNATIONAL;-DPIPAR_OS_MAC;-DPIPAR_LAYOUT_COLEMAK_DH"'
    artifact-name: pipar-point-right-international-mac-colemak-dh
  - board: pipar_point@right
    snippet: trackpoint studio-rpc-usb-uart
    cmake-args: '-DDTS_EXTRA_CPPFLAGS="-DPIPAR_HOST_INTERNATIONAL;-DPIPAR_OS_MAC;-DPIPAR_LAYOUT_QWERTY"'
    artifact-name: pipar-point-right-international-mac-qwerty
  - board: pipar_point@right
    snippet: trackpoint studio-rpc-usb-uart
    cmake-args: '-DDTS_EXTRA_CPPFLAGS="-DPIPAR_HOST_INTERNATIONAL;-DPIPAR_OS_LINUX;-DPIPAR_LAYOUT_COLEMAK_DH"'
    artifact-name: pipar-point-right-international-linux-colemak-dh
  - board: pipar_point@right
    snippet: trackpoint studio-rpc-usb-uart
    cmake-args: '-DDTS_EXTRA_CPPFLAGS="-DPIPAR_HOST_INTERNATIONAL;-DPIPAR_OS_LINUX;-DPIPAR_LAYOUT_QWERTY"'
    artifact-name: pipar-point-right-international-linux-qwerty
  - board: pipar_point@left
    artifact-name: pipar-point-left
  - board: pipar_point@left
    shield: settings_reset
    artifact-name: pipar-point-settings-reset
  # Pipar ja Sool: the dongle holds the keymap
  - board: xiao_ble
    shield: pipar_sool_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: '-DDTS_EXTRA_CPPFLAGS="-DPIPAR_HOST_ESTONIAN;-DPIPAR_OS_WIN;-DPIPAR_LAYOUT_COLEMAK_DH"'
    artifact-name: pipar-sool-dongle-estonian-windows-colemak-dh
  - board: xiao_ble
    shield: pipar_sool_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: '-DDTS_EXTRA_CPPFLAGS="-DPIPAR_HOST_ESTONIAN;-DPIPAR_OS_WIN;-DPIPAR_LAYOUT_QWERTY"'
    artifact-name: pipar-sool-dongle-estonian-windows-qwerty
  - board: xiao_ble
    shield: pipar_sool_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: '-DDTS_EXTRA_CPPFLAGS="-DPIPAR_HOST_ESTONIAN;-DPIPAR_OS_MAC;-DPIPAR_LAYOUT_COLEMAK_DH"'
    artifact-name: pipar-sool-dongle-estonian-mac-colemak-dh
  - board: xiao_ble
    shield: pipar_sool_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: '-DDTS_EXTRA_CPPFLAGS="-DPIPAR_HOST_ESTONIAN;-DPIPAR_OS_MAC;-DPIPAR_LAYOUT_QWERTY"'
    artifact-name: pipar-sool-dongle-estonian-mac-qwerty
  - board: xiao_ble
    shield: pipar_sool_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: '-DDTS_EXTRA_CPPFLAGS="-DPIPAR_HOST_ESTONIAN;-DPIPAR_OS_LINUX;-DPIPAR_LAYOUT_COLEMAK_DH"'
    artifact-name: pipar-sool-dongle-estonian-linux-colemak-dh
  - board: xiao_ble
    shield: pipar_sool_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: '-DDTS_EXTRA_CPPFLAGS="-DPIPAR_HOST_ESTONIAN;-DPIPAR_OS_LINUX;-DPIPAR_LAYOUT_QWERTY"'
    artifact-name: pipar-sool-dongle-estonian-linux-qwerty
  - board: xiao_ble
    shield: pipar_sool_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: '-DDTS_EXTRA_CPPFLAGS="-DPIPAR_HOST_INTERNATIONAL;-DPIPAR_LAYOUT_COLEMAK_DH"'
    artifact-name: pipar-sool-dongle-international-colemak-dh
  - board: xiao_ble
    shield: pipar_sool_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: '-DDTS_EXTRA_CPPFLAGS="-DPIPAR_HOST_INTERNATIONAL;-DPIPAR_LAYOUT_QWERTY"'
    artifact-name: pipar-sool-dongle-international-qwerty
  - board: xiao_ble
    shield: pipar_sool_left
    artifact-name: pipar-sool-left
  - board: xiao_ble
    shield: pipar_sool_right
    artifact-name: pipar-sool-right
  - board: xiao_ble
    shield: settings_reset
    artifact-name: pipar-sool-settings-reset
  # Pipar Chip and Pipar Flake: keypads, no layout or OS variants
  - board: pipar_chip
    artifact-name: pipar-chip
  - board: pipar_chip
    shield: settings_reset
    artifact-name: pipar-chip-settings-reset
  - board: nice_nano
    shield: pipar_flake
    artifact-name: pipar-flake
  - board: nice_nano
    shield: settings_reset
    artifact-name: pipar-flake-settings-reset

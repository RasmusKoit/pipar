parse_config:
  preprocess: true
  raw_binding_map:
    '&uc 0xfc 0xdc': Ü
    '&uc 0xf5 0xd5': Õ
    '&uc 0xf6 0xd6': Ö
    '&uc 0xe4 0xc4': Ä
    '&cut': Cut
    '&copy': Copy
    '&paste': Paste
    '&word_caps':
      t: Caps Word
      s: Caps Lock
    '&bt_sel_0':
      t: BT 1
      s: ⇧=clear
    '&bt_sel_1':
      t: BT 2
      s: ⇧=clear
    '&bt_sel_2':
      t: BT 3
      s: ⇧=clear
    '&bt_sel_3':
      t: BT 4
      s: ⇧=clear
    '&bt BT_CLR_ALL': Clear all BT
    '&out OUT_TOG': USB/BT toggle
    '&bl BL_CYCLE': Light cycle
    '&bl BL_TOG': Light on/off
    '&bl BL_INC': Light +
    '&bl BL_DEC': Light −
    '&studio_unlock': Studio unlock
    '&mkp MB1': Left click
    '&mkp MB2': Right click
    '&mkp MB3': Middle click
  zmk_keycode_map:
    EXCLAMATION: '!'
    EXCL: '!'
    AT_SIGN: '@'
    AT: '@'
    HASH: '#'
    POUND: '#'
    DOLLAR: $
    DLLR: $
    PERCENT: '%'
    PRCNT: '%'
    CARET: ^
    AMPERSAND: '&'
    AMPS: '&'
    ASTERISK: '*'
    ASTRK: '*'
    STAR: '*'
    LEFT_PARENTHESIS: (
    LPAR: (
    RIGHT_PARENTHESIS: )
    RPAR: )
    EQUAL: '='
    PLUS: +
    MINUS: '-'
    UNDERSCORE: _
    UNDER: _
    SLASH: /
    FSLH: /
    QUESTION: '?'
    QMARK: '?'
    BACKSLASH: \
    BSLH: \
    PIPE: '|'
    NON_US_BACKSLASH: \
    PIPE2: '|'
    NON_US_BSLH: '|'
    SEMICOLON: ;
    SEMI: ;
    COLON: ':'
    SINGLE_QUOTE: ''''
    SQT: ''''
    APOSTROPHE: ''''
    APOS: ''''
    DOUBLE_QUOTES: '"'
    DQT: '"'
    COMMA: ','
